[project]
name = "kaitlyn-korner"
version = "0.1.0"
description = "Kaitlyn DeValk-Hammond's portfolio and cybersecurity research site"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "flask-flatpages>=0.8,<1",
    "frozen-flask>=1,<2",
    "markdown>=3.8,<4",
    "pygments>=2.19,<3",
]

[dependency-groups]
dev = [
    "pagefind[extended]>=1.4,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
required-version = ">=0.12.6,<0.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
